services:
  adminer:
    image: ghcr.io/agungdh/adminer
    restart: always
    ports:
      - "127.0.0.1:8083:8080"
    # Run as the host user so SQLite journal files are not created as root.
    user: "1000:1000"
    volumes:
      # Open the database at http://127.0.0.1:8083 using the SQLite driver
      # with /db/database.sqlite as the server and an empty password.
      - ./database:/db
